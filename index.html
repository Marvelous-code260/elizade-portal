<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Portal</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #1e3c72, #2a5298); /* Matching blue gradient background */
            font-family: Arial, sans-serif;
        }
       
        .login-card {
            background-color: white;
            padding: 40px 30px;
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 400px;
            box-sizing: border-box;
            text-align: center;
        }
        .logo {
            width: 80px;
            margin-bottom: 15px;
        }

        h2 {
            color: #0b2545;
            margin: 0 0 5px 0;
            font-size: 24px;
        }

        p {
            color: #8da9c4;
            margin: 0 0 30px 0;
            font-size: 16px;
        }
        .input-group {
            text-align: left;
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: bold;
            color: #0b2545;
            margin-bottom: 8px;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            font-size: 16px;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.3s;
        }

        input:focus {
            border-color: #1e3c72;
            outline: none;
            border-color: #032b53;
            box-shadow: 0 0 0 1px #032b53;
        }
        .sign-in-btn {
            width: 100%;
            padding: 14px;
            background-color: #0b2545;
            color: white;
            border: none;
            border-radius: 30px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s;
            margin-top: 10px;
        }

        .sign-in-btn:hover {
            background-color: #1e3c72;
        }
    </style>
</head>
<body>
    <div class="login-card">
         <img src="images/WhatsApp1.jpeg" alt="university logo" class="logo" style="width: 80px; height: auto; margin-bottom: 15px; display: block; margin-left: auto; margin-right: auto;">
        
        <h2>Elizade University</h2>
        <p>Undergraduate Portal</p>

      <form action="">
                <div class="input-group">
                    <label for="username">Username</label>
                    <div class="input-wrapper" style="position: relative; display: flex; align-items: center;">
                        <input type="text" id="username" placeholder="Firstname.lastname" style="width: 100%; padding: 14px 45px 14px 16px; border: 1.5px solid #cbd5e1; border-radius: 12px; font-size: 15px; outline: none; box-sizing: border-box;">
                        <img src="images/WhatsApp3.jpeg" class="field-icon" alt="User Icon" style="position: absolute; right: 16px; width: 35px; height: 40px; object-fit: contain; pointer-events: none;">
                    </div>
                </div>
                <div class="input-group">
                    <label for="password">Password</label>
                    <div class="input-wrapper" style="position: relative; display: flex; align-items: center;">
                        <input type="password" id="password" placeholder="••••••••" style="width: 100%; padding: 14px 45px 14px 16px; border: 1.5px solid #cbd5e1; border-radius: 12px; font-size: 15px; outline: none; box-sizing: border-box;">
                        <img src="images/whatsApp4.jpeg" class="field-icon" alt="Lock Icon" style="position: absolute; right: 16px; width: 35px; height:40px; object-fit: contain; pointer-events: none;">
                    </div>
                </div>
                <button type="submit" class="sign-in-btn">➤ Sign In</button>
            </form>

        </div>
    </div>
    <div class="footer" style="position: absolute; bottom: 15px; left: 0; width: 100%; text-align: center; color: rgba(255, 255, 255, 0.6);">
        Secure • ICT Elizade University 2026
    </div>

</body>
</html>
